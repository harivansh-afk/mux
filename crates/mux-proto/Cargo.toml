[package]
name = "mux-proto"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# The async frame adapters. Off by default so mux-attach, a sync binary,
# links nothing from tokio.
[features]
tokio = ["dep:tokio"]

[dependencies]
serde.workspace = true
postcard.workspace = true
tokio = { workspace = true, optional = true }

[dev-dependencies]
# `error_kinds_serialise_by_name` pins the strings Mux.app switches on.
serde_json.workspace = true
