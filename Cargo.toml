[workspace]
resolver = "2"
members = ["crates/mux-proto", "crates/mux-attach", "crates/muxd", "crates/ghostty-vt"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://git.harivan.sh/harivansh-afk/mux"
publish = false

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
# Group lints need priority below per-lint overrides so allow entries can
# opt out without disabling the group (cargo errors with
# `lint_groups_priority` otherwise).
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"

[workspace.dependencies]
# Local crates: declared once here (the one table where a `path` is allowed);
# members inherit with `name.workspace = true`.
mux-proto = { path = "crates/mux-proto" }
ghostty-vt = { path = "crates/ghostty-vt" }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
nix = { version = "0.29", features = ["term", "process", "fs", "socket", "poll", "signal", "user"] }
parking_lot = "0.12"
libc = "0.2"
# M3 remote transport (QUIC) + auth material. Pre-pinned here so parallel
# branches don't conflict on dependency additions.
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rcgen = "0.13"
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
