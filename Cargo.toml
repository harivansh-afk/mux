[workspace]
resolver = "2"
members = ["crates/mux-proto", "crates/mux-attach", "crates/muxd", "crates/ghostty-vt"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://git.harivan.sh/harivansh-afk/mux"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
nix = { version = "0.29", features = ["term", "process", "fs", "socket", "poll", "signal", "user"] }
rustix = { version = "0.38", features = ["termios", "pty", "fs", "process"] }
parking_lot = "0.12"
