[workspace]
resolver = "2"
members = ["crates/mux-proto", "crates/mux-attach", "crates/muxd"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://git.harivan.sh/harivansh-afk/mux"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
