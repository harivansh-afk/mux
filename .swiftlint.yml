# Gate: swiftlint lint --strict app/Sources (violations at any severity fail).
included:
  - app/Sources

# Geometry/terminal code uses idiomatic short names (t, w, dy).
identifier_name:
  min_length: 1

line_length:
  warning: 120
  error: 200

# Layout belongs to SwiftFormat; SwiftLint defers where the two disagree
# (trailing commas in multiline literals, brace placement after multiline
# conditions).
disabled_rules:
  - trailing_comma
opening_brace:
  ignore_multiline_statement_conditions: true

# Ratchets, ix-style: thresholds set ~10% above the measured worst offender
# so the gate trips on regression, not on drift. Lower them as code is broken
# up; never raise without a dated reason here.
# 2026-08-09 baseline: PaneView 297 lines; GhosttyRuntime.init complexity 21,
# 77 lines; HelpOverlay layout 55 lines; MuxWindowController.swift 406 lines.
file_length:
  warning: 450
  error: 600
type_body_length:
  warning: 330
  error: 500
cyclomatic_complexity:
  warning: 24
  error: 40
function_body_length:
  warning: 85
  error: 120
